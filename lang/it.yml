it:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'nessun assegno parentale'
    'MonthsNotice': 'L''assegno parentale (Elterngeld) viene pagato per i mesi di vita del bambino (esempio: nascita il 10 aprile – 1° mese di vita dal 10 aprile al 9 maggio). Entrambi i genitori possono dividersi insieme 14 mesi di assegno parentale di base (Basiselterngeld) (un solo genitore 12, genitori soli 14); ciascun genitore almeno 2 mesi. Un mese di Basiselterngeld può essere scambiato con 2 mesi di ElterngeldPlus. Il bonus di partenariato (Partnerschaftsbonus) viene usato da entrambi i genitori contemporaneamente per 2-4 mesi consecutivi lavorando da 24 a 32 ore settimanali. Dal 15° mese di vita la percezione non può essere interrotta. Per una pianificazione valida utilizzi il calcolatore dell''assegno parentale (Elterngeldrechner) del Ministero federale della Famiglia.'
    'Month.basis': 'Assegno parentale di base (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Bonus di partenariato (Partnerschaftsbonus)'
    'Month': '{month}° mese di vita'
    'BASIS_PREMATURE': 'Il Basiselterngeld dopo il 14° mese di vita è possibile solo per i bambini nati particolarmente prematuri.'
    'MIN_MONTHS': 'Ogni genitore che richiede l''assegno parentale deve percepirlo per almeno 2 mesi di vita.'
    'MONTHS_SUMMARY': 'Verifichi la pianificazione dei mesi di assegno parentale.'
