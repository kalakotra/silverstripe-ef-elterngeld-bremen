ar:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'بدون إعانة الوالدين'
    'MonthsNotice': 'تُدفع إعانة الوالدين (Elterngeld) عن أشهر عمر الطفل (مثال: الولادة في 10 أبريل – الشهر 1 من العمر من 10 أبريل إلى 9 مايو). يمكن للوالدين معًا تقاسم 14 شهرًا من إعانة الوالدين الأساسية (Basiselterngeld) (أحد الوالدين وحده 12، الوالد المنفرد 14)؛ ولكل والد 2 من الأشهر على الأقل. يمكن استبدال شهر واحد من Basiselterngeld بـ 2 من أشهر ElterngeldPlus. يستخدم الوالدان مكافأة الشراكة (Partnerschaftsbonus) في الوقت نفسه لمدة 2 إلى 4 أشهر متتالية مع العمل من 24 إلى 32 ساعة أسبوعيًا. اعتبارًا من الشهر 15 من العمر يجب ألا ينقطع الاستلام. للحصول على تخطيط صحيح استخدم حاسبة إعانة الوالدين (Elterngeldrechner) التابعة لوزارة الأسرة الاتحادية.'
    'Month.basis': 'إعانة الوالدين الأساسية (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'مكافأة الشراكة (Partnerschaftsbonus)'
    'Month': 'الشهر {month} من العمر'
    'BASIS_PREMATURE': 'لا تكون Basiselterngeld بعد الشهر 14 من العمر ممكنة إلا للأطفال المولودين مبكرًا بشكل خاص.'
    'MIN_MONTHS': 'يجب على كل والد يتقدم بطلب إعانة الوالدين أن يحصل عليها لمدة 2 من أشهر العمر على الأقل.'
    'MONTHS_SUMMARY': 'يرجى التحقق من تخطيط أشهر إعانة الوالدين.'
