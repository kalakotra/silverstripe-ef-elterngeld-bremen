en:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'no parental allowance'
    'MonthsNotice': 'Parental allowance (Elterngeld) is paid for the child''s months of life (example: birth on 10 April – 1st month of life 10 April to 9 May). Both parents together can share 14 months of basic parental allowance (Basiselterngeld) (one parent alone 12, single parents 14); each parent at least 2 months. One month of Basiselterngeld can be exchanged for 2 months of ElterngeldPlus. Both parents use the partnership bonus (Partnerschaftsbonus) at the same time in 2 to 4 consecutive months working 24 to 32 hours per week. From the 15th month of life the payments must not be interrupted. For a valid plan, use the parental allowance calculator (Elterngeldrechner) of the Federal Family Ministry.'
    'Month.basis': 'Basic parental allowance (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Partnership bonus (Partnerschaftsbonus)'
    'Month': 'Month {month} of life'
    'BASIS_PREMATURE': 'Basiselterngeld after the 14th month of life is only possible for children born especially early.'
    'MIN_MONTHS': 'Every parent who applies for parental allowance must receive it for at least 2 months of life.'
    'MONTHS_SUMMARY': 'Please check your planning of the parental allowance months.'
  'Kalakotra\EFormElterngeldBremen\Forms\Form_Assessment2':
