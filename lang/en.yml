    'LeaveNotice': 'Ideally align your parental leave (Elternzeit) with the child''s months of life, otherwise income is offset against parental allowance on a daily basis. Notify your employer of the parental leave at least 7 weeks before it begins. Without parental leave, leave the fields empty.'
