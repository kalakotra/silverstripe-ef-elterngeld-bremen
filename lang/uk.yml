uk:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'без батьківської допомоги'
    'MonthsNotice': 'Батьківська допомога (Elterngeld) виплачується за місяці життя дитини (приклад: народження 10 квітня – 1-й місяць життя з 10 квітня по 9 травня). Обоє батьків разом можуть розподілити 14 місяців базової батьківської допомоги (Basiselterngeld) (один із батьків сам – 12, одинокі батьки – 14); кожен із батьків – щонайменше 2 місяці. Один місяць Basiselterngeld можна обміняти на 2 місяці ElterngeldPlus. Партнерський бонус (Partnerschaftsbonus) обоє батьків отримують одночасно протягом 2–4 місяців поспіль при роботі від 24 до 32 годин на тиждень. З 15-го місяця життя виплату не можна переривати. Для правильного планування скористайтеся калькулятором батьківської допомоги (Elterngeldrechner) Федерального міністерства у справах сім''ї.'
    'Month.basis': 'Базова батьківська допомога (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Партнерський бонус (Partnerschaftsbonus)'
    'Month': '{month}-й місяць життя'
    'BASIS_PREMATURE': 'Basiselterngeld після 14-го місяця життя можливе лише для дітей, народжених особливо рано.'
    'MIN_MONTHS': 'Кожен із батьків, який подає заяву, повинен отримувати батьківську допомогу щонайменше 2 місяці життя.'
    'MONTHS_SUMMARY': 'Будь ласка, перевірте планування місяців батьківської допомоги.'
