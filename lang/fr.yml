fr:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'pas d''allocation parentale'
    'MonthsNotice': 'L''allocation parentale (Elterngeld) est versée pour les mois de vie de l''enfant (exemple : naissance le 10 avril – 1er mois de vie du 10 avril au 9 mai). Les deux parents peuvent se partager ensemble 14 mois d''allocation parentale de base (Basiselterngeld) (un parent seul 12, parents isolés 14) ; chaque parent au moins 2 mois. Un mois de Basiselterngeld peut être échangé contre 2 mois d''ElterngeldPlus. Le bonus de partenariat (Partnerschaftsbonus) est pris par les deux parents en même temps pendant 2 à 4 mois consécutifs en travaillant de 24 à 32 heures par semaine. À partir du 15e mois de vie, le versement ne doit pas être interrompu. Pour une planification valable, utilisez le calculateur d''allocation parentale (Elterngeldrechner) du ministère fédéral de la Famille.'
    'Month.basis': 'Allocation parentale de base (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Bonus de partenariat (Partnerschaftsbonus)'
    'Month': '{month}e mois de vie'
    'BASIS_PREMATURE': 'La Basiselterngeld après le 14e mois de vie n''est possible que pour les enfants nés particulièrement prématurément.'
    'MIN_MONTHS': 'Chaque parent qui demande l''allocation parentale doit la percevoir pendant au moins 2 mois de vie.'
    'MONTHS_SUMMARY': 'Veuillez vérifier la planification des mois d''allocation parentale.'
