    'AcceptNoReturn': 'J''accepte expressément que vous commenciez l''exécution du contrat avant l''expiration du délai de rétractation. Je sais que, par ce consentement, je perds mon droit de rétractation dès le début de l''exécution du contrat.'
    'SignatureRequired': 'Veuillez signer la demande. Votre signature est insérée à la page 23 (questions qui vous sont posées) ; l''autre parent signe à la main la demande imprimée.'
