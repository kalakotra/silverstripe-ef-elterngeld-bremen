bg:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'без родителски помощи'
    'MonthsNotice': 'Родителските помощи (Elterngeld) се изплащат за месеците от живота на детето (пример: раждане на 10 април – 1-ви месец от живота от 10 април до 9 май). Двамата родители заедно могат да си поделят 14 месеца основни родителски помощи (Basiselterngeld) (само единият родител 12, самотните родители 14); всеки родител поне 2 месеца. Един месец Basiselterngeld може да се замени с 2 месеца ElterngeldPlus. Партньорския бонус (Partnerschaftsbonus) двамата родители използват едновременно в продължение на 2 до 4 последователни месеца при работа от 24 до 32 часа седмично. От 15-ия месец от живота изплащането не трябва да се прекъсва. За валидно планиране използвайте калкулатора за родителски помощи (Elterngeldrechner) на Федералното министерство на семейството.'
    'Month.basis': 'Основни родителски помощи (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Партньорски бонус (Partnerschaftsbonus)'
    'Month': '{month}-и месец от живота'
    'BASIS_PREMATURE': 'Basiselterngeld след 14-ия месец от живота е възможно само за деца, родени особено рано.'
    'MIN_MONTHS': 'Всеки родител, който подава заявление, трябва да получава родителски помощи поне 2 месеца от живота.'
    'MONTHS_SUMMARY': 'Моля, проверете планирането на месеците с родителски помощи.'
