    'AcceptNoReturn': 'Wyraźnie zgadzam się, abyście rozpoczęli wykonywanie umowy przed upływem terminu na odstąpienie. Wiem, że wyrażając tę zgodę, z chwilą rozpoczęcia wykonywania umowy tracę prawo do odstąpienia.'
