pl:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'bez zasiłku rodzicielskiego'
    'MonthsNotice': 'Zasiłek rodzicielski (Elterngeld) wypłacany jest za miesiące życia dziecka (przykład: urodzenie 10 kwietnia – 1. miesiąc życia od 10 kwietnia do 9 maja). Oboje rodzice mogą wspólnie podzielić 14 miesięcy podstawowego zasiłku rodzicielskiego (Basiselterngeld) (jeden rodzic sam 12, rodzice samotnie wychowujący 14); każdy rodzic co najmniej 2 miesiące. Jeden miesiąc Basiselterngeld można zamienić na 2 miesiące ElterngeldPlus. Z bonusu partnerskiego (Partnerschaftsbonus) oboje rodzice korzystają jednocześnie przez 2 do 4 kolejnych miesięcy, pracując od 24 do 32 godzin tygodniowo. Od 15. miesiąca życia pobieranie nie może być przerywane. Aby zaplanować poprawnie, skorzystaj z kalkulatora zasiłku rodzicielskiego (Elterngeldrechner) Federalnego Ministerstwa ds. Rodziny.'
    'Month.basis': 'Podstawowy zasiłek rodzicielski (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Bonus partnerski (Partnerschaftsbonus)'
    'Month': '{month}. miesiąc życia'
    'BASIS_PREMATURE': 'Basiselterngeld po 14. miesiącu życia jest możliwy tylko w przypadku dzieci urodzonych szczególnie wcześnie.'
    'MIN_MONTHS': 'Każdy rodzic, który składa wniosek, musi pobierać zasiłek rodzicielski przez co najmniej 2 miesiące życia.'
    'MONTHS_SUMMARY': 'Proszę sprawdzić planowanie miesięcy zasiłku rodzicielskiego.'
