ro:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'fără indemnizație parentală'
    'MonthsNotice': 'Indemnizația parentală (Elterngeld) se plătește pentru lunile de viață ale copilului (exemplu: naștere pe 10 aprilie – luna 1 de viață 10 aprilie – 9 mai). Ambii părinți pot împărți împreună 14 luni de indemnizație parentală de bază (Basiselterngeld) (un singur părinte 12, părinții singuri 14); fiecare părinte cel puțin 2 luni. O lună de Basiselterngeld poate fi schimbată pe 2 luni de ElterngeldPlus. Bonusul de parteneriat (Partnerschaftsbonus) îl folosesc ambii părinți în același timp, timp de 2 până la 4 luni consecutive, lucrând între 24 și 32 de ore pe săptămână. Începând cu luna 15 de viață, plata nu mai poate fi întreruptă. Pentru o planificare corectă folosiți calculatorul de indemnizație parentală (Elterngeldrechner) al Ministerului Federal al Familiei.'
    'Month.basis': 'Indemnizație parentală de bază (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Bonus de parteneriat (Partnerschaftsbonus)'
    'Month': 'Luna {month} de viață'
    'BASIS_PREMATURE': 'Basiselterngeld după luna 14 de viață este posibilă doar pentru copiii născuți deosebit de prematur.'
    'MIN_MONTHS': 'Fiecare părinte care solicită indemnizația parentală trebuie să o primească cel puțin 2 luni de viață.'
    'MONTHS_SUMMARY': 'Vă rugăm să verificați planificarea lunilor de indemnizație parentală.'
