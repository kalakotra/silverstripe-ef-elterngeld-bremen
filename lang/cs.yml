cs:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'bez rodičovského příspěvku'
    'MonthsNotice': 'Rodičovský příspěvek (Elterngeld) se vyplácí za měsíce života dítěte (příklad: narození 10. dubna – 1. měsíc života od 10. dubna do 9. května). Oba rodiče si mohou společně rozdělit 14 měsíců základního rodičovského příspěvku (Basiselterngeld) (jeden rodič sám 12, samoživitelé 14); každý rodič nejméně 2 měsíce. Jeden měsíc Basiselterngeld lze vyměnit za 2 měsíce ElterngeldPlus. Partnerský bonus (Partnerschaftsbonus) čerpají oba rodiče současně po dobu 2 až 4 po sobě jdoucích měsíců při práci 24 až 32 hodin týdně. Od 15. měsíce života nesmí být čerpání přerušeno. Pro správné plánování použijte kalkulačku rodičovského příspěvku (Elterngeldrechner) Spolkového ministerstva pro rodinu.'
    'Month.basis': 'Základní rodičovský příspěvek (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Partnerský bonus (Partnerschaftsbonus)'
    'Month': '{month}. měsíc života'
    'BASIS_PREMATURE': 'Basiselterngeld po 14. měsíci života je možný jen u dětí narozených zvlášť předčasně.'
    'MIN_MONTHS': 'Každý rodič, který podává žádost, musí pobírat rodičovský příspěvek nejméně 2 měsíce života.'
    'MONTHS_SUMMARY': 'Zkontrolujte prosím plánování měsíců rodičovského příspěvku.'
