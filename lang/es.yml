es:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'sin prestación parental'
    'MonthsNotice': 'La prestación parental (Elterngeld) se paga por los meses de vida del niño (ejemplo: nacimiento el 10 de abril – 1.er mes de vida del 10 de abril al 9 de mayo). Ambos progenitores pueden repartirse juntos 14 meses de prestación parental básica (Basiselterngeld) (un progenitor solo 12, familias monoparentales 14); cada progenitor al menos 2 meses. Un mes de Basiselterngeld puede cambiarse por 2 meses de ElterngeldPlus. El bono de pareja (Partnerschaftsbonus) lo usan ambos progenitores a la vez durante 2 a 4 meses consecutivos trabajando entre 24 y 32 horas semanales. A partir del 15.º mes de vida la percepción no puede interrumpirse. Para una planificación válida utilice la calculadora de prestación parental (Elterngeldrechner) del Ministerio Federal de Familia.'
    'Month.basis': 'Prestación parental básica (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Bono de pareja (Partnerschaftsbonus)'
    'Month': '{month}.º mes de vida'
    'BASIS_PREMATURE': 'La Basiselterngeld después del 14.º mes de vida solo es posible para niños nacidos especialmente prematuros.'
    'MIN_MONTHS': 'Cada progenitor que solicite la prestación parental debe percibirla al menos durante 2 meses de vida.'
    'MONTHS_SUMMARY': 'Por favor, compruebe la planificación de los meses de prestación parental.'
