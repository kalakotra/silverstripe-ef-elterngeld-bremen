tr:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'ebeveyn parası yok'
    'MonthsNotice': 'Ebeveyn parası (Elterngeld) çocuğun yaşam ayları için ödenir (örnek: 10 Nisan doğum – 1. yaşam ayı 10 Nisan ile 9 Mayıs arası). İki ebeveyn birlikte 14 ay temel ebeveyn parasını (Basiselterngeld) paylaşabilir (tek ebeveyn 12, yalnız ebeveynler 14); her ebeveyn en az 2 ay. Bir ay Basiselterngeld, 2 ay ElterngeldPlus ile değiştirilebilir. Ortaklık bonusunu (Partnerschaftsbonus) iki ebeveyn aynı anda, art arda 2 ila 4 ay boyunca haftada 24 ila 32 saat çalışarak kullanır. 15. yaşam ayından itibaren ödeme kesintiye uğramamalıdır. Geçerli bir planlama için Federal Aile Bakanlığı''nın ebeveyn parası hesaplayıcısını (Elterngeldrechner) kullanın.'
    'Month.basis': 'Temel ebeveyn parası (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Ortaklık bonusu (Partnerschaftsbonus)'
    'Month': '{month}. yaşam ayı'
    'BASIS_PREMATURE': '14. yaşam ayından sonra Basiselterngeld yalnızca özellikle erken doğan çocuklar için mümkündür.'
    'MIN_MONTHS': 'Ebeveyn parası için başvuran her ebeveyn en az 2 yaşam ayı boyunca ebeveyn parası almalıdır.'
    'MONTHS_SUMMARY': 'Lütfen ebeveyn parası aylarının planlamasını kontrol edin.'
