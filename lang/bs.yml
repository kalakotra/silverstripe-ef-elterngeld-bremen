bs:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'bez roditeljskog doplatka'
    'MonthsNotice': 'Roditeljski doplatak (Elterngeld) isplaćuje se za mjesece života djeteta (primjer: rođenje 10. aprila – 1. mjesec života od 10. aprila do 9. maja). Oba roditelja zajedno mogu podijeliti 14 mjeseci osnovnog roditeljskog doplatka (Basiselterngeld) (jedan roditelj sam 12, samohrani roditelji 14); svaki roditelj najmanje 2 mjeseca. Jedan mjesec Basiselterngeld može se zamijeniti za 2 mjeseca ElterngeldPlus. Partnerski bonus (Partnerschaftsbonus) oba roditelja koriste istovremeno u 2 do 4 uzastopna mjeseca uz 24 do 32 sata rada sedmično. Od 15. mjeseca života isplata se ne smije prekidati. Za ispravno planiranje koristite kalkulator roditeljskog doplatka (Elterngeldrechner) saveznog ministarstva za porodicu.'
    'Month.basis': 'Osnovni roditeljski doplatak (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Partnerski bonus (Partnerschaftsbonus)'
    'Month': '{month}. mjesec života'
    'BASIS_PREMATURE': 'Basiselterngeld nakon 14. mjeseca života moguć je samo za posebno rano rođenu djecu.'
    'MIN_MONTHS': 'Svaki roditelj koji podnosi zahtjev mora primati roditeljski doplatak najmanje 2 mjeseca života.'
    'MONTHS_SUMMARY': 'Molimo provjerite planiranje mjeseci roditeljskog doplatka.'
