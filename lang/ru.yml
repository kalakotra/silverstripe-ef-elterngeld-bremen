ru:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'без родительского пособия'
    'MonthsNotice': 'Родительское пособие (Elterngeld) выплачивается за месяцы жизни ребёнка (пример: рождение 10 апреля – 1-й месяц жизни с 10 апреля по 9 мая). Оба родителя вместе могут разделить 14 месяцев базового родительского пособия (Basiselterngeld) (один родитель один – 12, одинокие родители – 14); каждый родитель – не менее 2 месяцев. Один месяц Basiselterngeld можно обменять на 2 месяца ElterngeldPlus. Партнёрский бонус (Partnerschaftsbonus) оба родителя получают одновременно в течение 2–4 месяцев подряд при работе от 24 до 32 часов в неделю. С 15-го месяца жизни выплату нельзя прерывать. Для правильного планирования используйте калькулятор родительского пособия (Elterngeldrechner) Федерального министерства по делам семьи.'
    'Month.basis': 'Базовое родительское пособие (Basiselterngeld)'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Партнёрский бонус (Partnerschaftsbonus)'
    'Month': '{month}-й месяц жизни'
    'BASIS_PREMATURE': 'Basiselterngeld после 14-го месяца жизни возможно только для детей, родившихся особенно рано.'
    'MIN_MONTHS': 'Каждый родитель, подающий заявление, должен получать родительское пособие не менее 2 месяцев жизни.'
    'MONTHS_SUMMARY': 'Пожалуйста, проверьте планирование месяцев родительского пособия.'
