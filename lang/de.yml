de:
  'Kalakotra\EFormElterngeldBremen\Forms\MonthsStepTrait':
    'MonthNone': 'kein Elterngeld'
    'MonthsNotice': 'Elterngeld wird für Lebensmonate des Kindes gezahlt (Beispiel: Geburt am 10. April – 1. Lebensmonat 10. April bis 9. Mai). Beide Eltern können zusammen 14 Monate Basiselterngeld aufteilen (ein Elternteil allein 12, Alleinerziehende 14); jeder Elternteil mindestens 2 Monate. Ein Monat Basiselterngeld kann gegen 2 Monate ElterngeldPlus getauscht werden. Den Partnerschaftsbonus nutzen beide Eltern gleichzeitig in 2 bis 4 aufeinanderfolgenden Monaten bei 24 bis 32 Wochenstunden. Ab dem 15. Lebensmonat darf der Bezug nicht unterbrochen werden. Für eine gültige Planung nutzen Sie den Elterngeldrechner des Bundesfamilienministeriums.'
    'Month.basis': 'Basiselterngeld'
    'Month.plus': 'ElterngeldPlus'
    'Month.bonus': 'Partnerschaftsbonus'
    'Month': '{month}. Lebensmonat'
    'BASIS_PREMATURE': 'Basiselterngeld nach dem 14. Lebensmonat ist nur bei besonders früh geborenen Kindern möglich.'
    'MIN_MONTHS': 'Jeder Elternteil, der Elterngeld beantragt, muss für mindestens 2 Lebensmonate Elterngeld beziehen.'
    'MONTHS_SUMMARY': 'Bitte prüfen Sie Ihre Planung der Elterngeld-Monate.'
